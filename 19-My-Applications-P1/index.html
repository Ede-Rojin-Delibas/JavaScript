<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Guess the number from ME!</title>
  </head>
  <body>
    <header>
      <h1>Guess the number that I hold :)</h1>
      <p class="between">(tip: It is between 1 - 30)</p>
      <button class="btn again">Try Again!</button>
      <div class="number"></div>
      <br />
    </header>
    <main>
      <section class="left">
        <input type="number" class="guess" />
        <button class="btn check">Check!</button>
      </section>
      <section class="right"></section>
      <p class="message">Start Guessing...</p>
      <p class="label-score">💯 Score: <span class="score">30</span></p>
      <p class="label-highscore">
        🎖️Highscore: <span class="highscore">0</span>
      </p>
    </main>
  </body>
</html>
